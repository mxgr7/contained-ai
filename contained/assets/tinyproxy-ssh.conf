# tinyproxy config for the Git-over-SSH sidecar (PRD 09).
#
# Port 8889 and ConnectPort 22 together give us port-aware allowlisting:
# only hosts listed in the bind-mounted filter file can be tunneled, and
# only to port 22. The main HTTPS proxy runs a separate tinyproxy with
# ConnectPort 443 — see tinyproxy.conf. Keeping them as two processes
# means a bug in one filter list can't accidentally widen the other.

User nobody
Group nogroup
Port 8889
Listen 0.0.0.0
Timeout 600
LogLevel Warning
MaxClients 100

Allow 0.0.0.0/0

Filter "/etc/tinyproxy/filter-ssh"
FilterDefaultDeny Yes
FilterExtended Yes
FilterCaseSensitive No

# Port 22 only. Do NOT add 443 here — that's the HTTPS proxy's job, and
# sharing this CONNECT list with the HTTPS filter is exactly the hole
# PRD 06 closed.
ConnectPort 22
