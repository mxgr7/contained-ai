# tinyproxy config for the contained egress sidecar.
# The Filter file is bind-mounted at runtime; FilterDefaultDeny turns
# this into a strict allowlist keyed on hostname.

User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Warning
MaxClients 100

Allow 0.0.0.0/0

Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended Yes
FilterCaseSensitive No

# CONNECT targets we permit to pass through (the Filter above still
# decides *which* hostname is allowed for a given CONNECT). HTTPS only;
# SSH (port 22) egress is an opt-in follow-up — git over HTTPS is the
# supported path.
ConnectPort 443
