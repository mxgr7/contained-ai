default_agent: claude

# contained-ai is a pure-Python project with a small dep surface
# (pyyaml, pytest, ruff, mypy). The tool-wide defaults already cover
# pypi + github, so the only extras we need are what we want mounted
# into the container.

agents:
  claude:
    mounts_ro:
      # Let the agent run `gh` against github without granting write
      # access to the host config. Safe to drop if you don't use gh.
      - ~/.config/gh:/home/agent/.config/gh
