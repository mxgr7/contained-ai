[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contained-ai"
version = "0.0.1"
description = "Run AI coding agents in isolated Docker containers, ergonomically."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Max Gerer" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
contained = "contained.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["contained"]

[tool.hatch.build.targets.wheel.force-include]
"contained/assets" = "contained/assets"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
